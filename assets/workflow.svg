<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">Codex Drag Context workflow</title><desc id="desc">Select files in Explorer, drop them on Codex Context, then write your prompt in Codex. Concept illustration, not a screenshot.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2f"/><stop offset="1" stop-color="#19243a"/></linearGradient></defs>
<rect width="1120" height="390" rx="22" fill="url(#bg)"/>
<g font-family="system-ui, sans-serif"><text x="48" y="57" fill="#82efc5" font-size="16" font-weight="600">CODEX DRAG CONTEXT</text><text x="48" y="101" fill="#ffffff" font-size="31" font-weight="700">Less path copying. More coding.</text>
<rect x="48" y="144" width="285" height="170" rx="14" fill="#24334b"/><text x="70" y="176" fill="#b9c7dd" font-size="14">01 / EXPLORER</text><text x="70" y="215" fill="#fff" font-size="18">src/auth.ts</text><text x="70" y="247" fill="#fff" font-size="18">tests/auth.test.ts</text><text x="70" y="279" fill="#9eacc2" font-size="17">Select your context</text>
